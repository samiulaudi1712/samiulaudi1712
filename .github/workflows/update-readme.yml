name: Update Profile README

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:           # manual "Run workflow" button
  push:
    paths: ["update_readme.py"]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Add README sections (only the first time)
        run: python update_readme.py --init

      - name: Refresh README
        env:
          GH_USERNAME: samiulaudi1712
          # PROFILE_PAT is optional (needed for private repos / bio update); falls back to the default token
          GH_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
          UPDATE_BIO: "0"      # set to "1" to also refresh your GitHub bio (requires PROFILE_PAT with `user` scope)
        run: python update_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: auto-update README [skip ci]" && git push)
